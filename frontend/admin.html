<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易数创培云 - 合作对接管理后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0c0d10;
            --card-dark: #16181d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #e60012;
            --accent-red: #ff334b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 5%;
        }

        /* 登录遮罩层样式 */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 13, 16, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-card {
            background: var(--card-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .login-card h2 { font-size: 1.5rem; margin-bottom: 24px; color: #fff; }
        .login-input-group { margin-bottom: 20px; text-align: left; }
        .login-input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .login-input-group input {
            width: 100%; padding: 12px 16px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: #0c0d10; color: #fff; outline: none;
        }
        .login-input-group input:focus { border-color: var(--primary); }
        .btn-login {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #e60012 0%, #ff334b 100%); color: #fff;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 14px rgba(230, 0, 18, 0.4);
        }
        .btn-login:hover { opacity: 0.9; }

        /* 主后台页面 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; }
        .header-actions { display: flex; gap: 12px; }
        .btn-refresh, .btn-logout {
            color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
            cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .btn-refresh { background: linear-gradient(135deg, #e60012 0%, #ff334b 100%); }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-logout:hover { background: var(--danger); color: #fff; }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-dark); padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .stat-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
        .stat-card h2 { font-size: 2rem; color: var(--accent-red); }
        .table-container { background: var(--card-dark); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background: #0c0d10; color: var(--text-muted); font-weight: 600; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .btn-delete:hover { background: var(--danger); color: #fff; }
        .empty-tip { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- 登录拦截弹窗 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2><i class="fa-solid fa-lock"></i> 管理员登录</h2>
            <form id="loginForm">
                <div class="login-input-group">
                    <label>管理账号</label>
                    <input type="text" id="adminUser" placeholder="请输入账号" required>
                </div>
                <div class="login-input-group">
                    <label>登录密码</label>
                    <input type="password" id="adminPass" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn-login">安全登录</button>
            </form>
        </div>
    </div>

    <!-- 后台管理主体区域 -->
    <div class="header">
        <h1><i class="fa-solid fa-gauge-high"></i> 易数创培云 - 合作对接管理后台</h1>
        <div class="header-actions">
            <button class="btn-refresh" onclick="loadMessages()"><i class="fa-solid fa-rotate"></i> 刷新</button>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <p>总对接申请记录</p>
            <h2 id="totalCount">0</h2>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>提交时间</th>
                    <th>称呼 / 公司名称</th>
                    <th>联系电话</th>
                    <th>需求描述</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="messageList"></tbody>
        </table>
        <div id="emptyTip" class="empty-tip" style="display: none;">
            <i class="fa-regular fa-folder-open" style="font-size: 3rem; margin-bottom: 10px;"></i>
            <p>暂无任何合作对接数据</p>
        </div>
    </div>

    <script>
        function checkAuth() {
            const token = sessionStorage.getItem('adminToken');
            if (token) {
                document.getElementById('loginOverlay').style.display = 'none';
                loadMessages();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUser').value.trim();
            const password = document.getElementById('adminPass').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();

                if (result.success) {
                    sessionStorage.setItem('adminToken', result.token);
                    checkAuth();
                } else {
                    alert('❌ ' + result.error);
                }
            } catch (err) {
                alert('❌ 登录请求失败，请检查网络');
            }
        });

        async function loadMessages() {
            const token = sessionStorage.getItem('adminToken');
            if (!token) return;

            const tbody = document.getElementById('messageList');
            const emptyTip = document.getElementById('emptyTip');
            const totalCount = document.getElementById('totalCount');

            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px;">正在加载数据...</td></tr>';

            try {
                const res = await fetch('/api/messages', {
                    headers: { 'x-admin-token': token }
                });
                
                if (res.status === 401) {
                    alert('登录失效，请重新登录');
                    logout();
                    return;
                }

                const result = await res.json();
                if (result.success && result.data) {
                    const list = result.data;
                    totalCount.innerText = list.length;

                    if (list.length === 0) {
                        tbody.innerHTML = '';
                        emptyTip.style.display = 'block';
                        return;
                    }

                    emptyTip.style.display = 'none';
                    tbody.innerHTML = list.map(item => `
                        <tr>
                            <td style="white-space: nowrap; color: #94a3b8;">${item.createdAt || '未知时间'}</td>
                            <td style="font-weight: 600; color: #fff;">${escapeHtml(item.name)}</td>
                            <td style="color: #ff7875; font-family: monospace; font-size: 1.05rem;">${escapeHtml(item.phone)}</td>
                            <td>${escapeHtml(item.demand)}</td>
                            <td>
                                <button class="btn-delete" onclick="deleteMessage('${item.id}')">
                                    <i class="fa-solid fa-trash"></i> 删除
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #ef4444;">获取数据失败</td></tr>';
            }
        }

        async function deleteMessage(id) {
            if (!confirm('确定要删除这条对接记录吗？')) return;
            const token = sessionStorage.getItem('adminToken');

            try {
                const res = await fetch('/api/messages/' + id, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': token }
                });
                const result = await res.json();
                if (result.success) {
                    loadMessages();
                } else {
                    alert('删除失败: ' + result.error);
                }
            } catch (e) {
                alert('操作失败');
            }
        }

        function logout() {
            sessionStorage.removeItem('adminToken');
            location.reload();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
