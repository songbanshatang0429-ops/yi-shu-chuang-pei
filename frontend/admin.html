<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易数创培云 - 合作对接管理后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-refresh { background: #e53e3e; color: white; }
        .btn-logout { background: #4a5568; color: white; margin-left: 10px; }
        .btn-delete { background: #c53030; color: white; padding: 4px 10px; font-size: 0.85rem; }
        .btn-download { background: #2b6cb0; color: white; padding: 5px 12px; font-size: 0.85rem; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-download:hover { background: #3182ce; }
        .card { background: #1a1d24; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3748; }
        .stat-num { font-size: 2rem; color: #e53e3e; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #2d3748; font-size: 0.95rem; }
        th { color: #a0aec0; font-weight: 600; }
        tr:hover { background: #222630; }
        .no-file { color: #666; font-size: 0.85rem; }
        
        /* 登录弹窗样式 */
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #1a1d24; padding: 30px; border-radius: 8px; width: 320px; border: 1px solid #2d3748; text-align: center; }
        .login-box h2 { margin-bottom: 20px; font-size: 1.2rem; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f1117; border: 1px solid #4a5568; color: white; border-radius: 4px; }
        .login-box button { width: 100%; padding: 10px; background: #e53e3e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 登录弹窗 (未登录时显示) -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock"></i> 管理员登录</h2>
            <input type="text" id="username" placeholder="账号 (默认: angel)">
            <input type="password" id="password" placeholder="密码 (默认: 1231)">
            <button onclick="handleLogin()">登 录</button>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fa-solid fa-graduation-cap"></i> 易数创培云 - 合作对接管理后台</h1>
            <div>
                <button class="btn btn-refresh" onclick="fetchMessages()"><i class="fa-solid fa-rotate"></i> 刷新</button>
                <button class="btn btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
            </div>
        </div>

        <div class="card">
            <div style="color: #a0aec0;">总对接申请记录</div>
            <div class="stat-num" id="totalCount">0</div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>提交时间</th>
                        <th>称呼 / 公司名称</th>
                        <th>联系电话</th>
                        <th>需求描述</th>
                        <th>需求附件 (GridFS云文件)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="messageList">
                    <tr><td colspan="6" style="text-align: center; color: #718096;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 获取凭证 token
        function getToken() {
            return localStorage.getItem('adminToken') || 'TOKEN_ANGEL_SECURE_KEY_1231';
        }

        // 登录逻辑
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    document.getElementById('loginOverlay').style.display = 'none';
                    fetchMessages();
                } else {
                    alert('❌ ' + (data.error || '登录失败'));
                }
            } catch (err) {
                alert('网络请求失败');
            }
        }

        // 退出登录
        function handleLogout() {
            localStorage.removeItem('adminToken');
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        // 获取记录列表
        async function fetchMessages() {
            const token = getToken();
            try {
                const res = await fetch(`/api/messages?token=${token}`, {
                    headers: { 'x-admin-token': token }
                });

                if (res.status === 401) {
                    document.getElementById('loginOverlay').style.display = 'flex';
                    return;
                }

                const result = await res.json();
                if (!result.success) throw new Error(result.error);
                
                document.getElementById('loginOverlay').style.display = 'none';
                const list = result.data;
                document.getElementById('totalCount').innerText = list.length;
                
                const tbody = document.getElementById('messageList');
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #718096;">暂无对接数据</td></tr>';
                    return;
                }
                
                tbody.innerHTML = list.map(msg => {
                    // 渲染需求附件下载链接
                    let fileHtml = '<span class="no-file">无附件</span>';
                    if (msg.file && msg.file.fileId) {
                        const downloadUrl = `/api/files/${msg.file.fileId}?token=${token}`;
                        fileHtml = `<a href="${downloadUrl}" class="btn-download" target="_blank"><i class="fa-solid fa-download"></i> 下载《${escapeHtml(msg.file.fileName)}》</a>`;
                    }
                    
                    return `
                        <tr>
                            <td>${msg.createdAt || '未知时间'}</td>
                            <td><strong>${escapeHtml(msg.name)}</strong></td>
                            <td style="color: #fc8181;">${escapeHtml(msg.phone)}</td>
                            <td>${escapeHtml(msg.demand || '无')}</td>
                            <td>${fileHtml}</td>
                            <td>
                                <button class="btn btn-delete" onclick="deleteMessage('${msg.id}')"><i class="fa-solid fa-trash"></i> 删除</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // 删除记录
        async function deleteMessage(id) {
            if (!confirm('确定要删除这条记录及其附件吗？')) return;
            const token = getToken();
            try {
                const res = await fetch(`/api/messages/${id}?token=${token}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': token }
                });
                const result = await res.json();
                if (result.success) {
                    fetchMessages();
                } else {
                    alert('删除失败');
                }
            } catch (err) {
                alert('网络请求失败');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 页面打开自动加载数据
        fetchMessages();
    </script>
</body>
</html>
