<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易数创培云 - 合作对接管理后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-refresh { background: #e53e3e; color: white; }
        .btn-logout { background: #4a5568; color: white; margin-left: 10px; }
        .btn-delete { background: #c53030; color: white; padding: 4px 10px; font-size: 0.85rem; }
        .btn-download { background: #2b6cb0; color: white; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-download:hover { background: #3182ce; }
        .card { background: #1a1d24; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3748; }
        .stat-num { font-size: 2rem; color: #e53e3e; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #2d3748; font-size: 0.95rem; }
        th { color: #a0aec0; font-weight: 600; }
        tr:hover { background: #222630; }
        .no-file { color: #666; font-size: 0.85rem; }
        
        /* 强制高强度安全遮罩蒙版 */
        .login-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(10, 12, 16, 0.96); 
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 99999; 
        }
        .login-box { 
            background: #1a1d24; 
            padding: 35px 30px; 
            border-radius: 12px; 
            width: 360px; 
            border: 1px solid #2d3748; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center; 
        }
        .login-box h2 { margin-bottom: 25px; font-size: 1.3rem; color: #fff; }
        .login-box .input-group { margin-bottom: 18px; text-align: left; }
        .login-box label { display: block; font-size: 0.85rem; color: #a0aec0; margin-bottom: 6px; }
        .login-box input { width: 100%; padding: 12px; background: #0f1117; border: 1px solid #4a5568; color: white; border-radius: 6px; font-size: 0.95rem; }
        .login-box input:focus { border-color: #e53e3e; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: #e53e3e; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .login-box button:hover { background: #c53030; }
        .login-error { color: #fc8181; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
    </style>
</head>
<body>

    <!-- 强制登录遮罩蒙版 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2><i class="fa-solid fa-user-shield"></i> 管理员身份验证</h2>
            <div class="input-group">
                <label for="username"><i class="fa-solid fa-user"></i> 登录账号</label>
                <input type="text" id="username" placeholder="请输入管理员账号">
            </div>
            <div class="input-group">
                <label for="password"><i class="fa-solid fa-key"></i> 登录密码</label>
                <input type="password" id="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> 登录后台</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- 后台主界面 -->
    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fa-solid fa-graduation-cap"></i> 易数创培云 - 合作对接管理后台</h1>
            <div>
                <button class="btn btn-refresh" onclick="fetchMessages()"><i class="fa-solid fa-rotate"></i> 刷新</button>
                <button class="btn btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
            </div>
        </div>

        <div class="card">
            <div style="color: #a0aec0;">总对接申请记录</div>
            <div class="stat-num" id="totalCount">0</div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>提交时间</th>
                        <th>称呼 / 公司名称</th>
                        <th>联系电话</th>
                        <th>需求描述</th>
                        <th>需求附件 (GridFS云文件)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="messageList">
                    <tr><td colspan="6" style="text-align: center; color: #718096;">🔒 请先登录以查看管理数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔑 严格获取登录凭证，绝不设置硬编码 Token！
        function getToken() {
            return localStorage.getItem('adminToken') || '';
        }

        // 页面初始化检查
        window.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (!token) {
                showLoginOverlay('请先输入账号密码登录管理后台');
            } else {
                fetchMessages();
            }
        });

        function showLoginOverlay(msg = '') {
            document.getElementById('loginOverlay').style.display = 'flex';
            if (msg) document.getElementById('loginError').innerText = msg;
        }

        function hideLoginOverlay() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('loginError').innerText = '';
        }

        // 登录逻辑
        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('loginError');

            if (!user || !pass) {
                errDiv.innerText = '账号与密码不能为空！';
                return;
            }

            errDiv.innerText = '正在验证身份...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    hideLoginOverlay();
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    fetchMessages();
                } else {
                    errDiv.innerText = '❌ ' + (data.error || '账号或密码不正确');
                }
            } catch (err) {
                console.error(err);
                errDiv.innerText = '❌ 网络连接失败，请重试';
            }
        }

        // 退出登录
        function handleLogout() {
            localStorage.removeItem('adminToken');
            document.getElementById('messageList').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #718096;">🔒 已退出登录</td></tr>';
            document.getElementById('totalCount').innerText = '0';
            showLoginOverlay('已成功退出登录');
        }

        // 获取记录列表
        async function fetchMessages() {
            const token = getToken();
            if (!token) {
                showLoginOverlay('请先登录管理账号');
                return;
            }

            try {
                const res = await fetch(`/api/messages?token=${encodeURIComponent(token)}`, {
                    headers: { 'x-admin-token': token }
                });

                if (res.status === 401) {
                    localStorage.removeItem('adminToken');
                    showLoginOverlay('登录凭证已失效，请重新登录');
                    document.getElementById('messageList').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #e53e3e;">未授权访问</td></tr>';
                    document.getElementById('totalCount').innerText = '0';
                    return;
                }

                const result = await res.json();
                if (!result.success) throw new Error(result.error);

                hideLoginOverlay();

                const list = result.data || [];
                document.getElementById('totalCount').innerText = list.length;

                const tbody = document.getElementById('messageList');
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #718096;">暂无对接申请数据</td></tr>';
                    return;
                }

                tbody.innerHTML = list.map(msg => {
                    let fileHtml = '<span class="no-file">无附件</span>';
                    if (msg.file && msg.file.fileId) {
                        const downloadUrl = `/api/files/${msg.file.fileId}?token=${encodeURIComponent(token)}`;
                        fileHtml = `<a href="${downloadUrl}" class="btn-download" target="_blank"><i class="fa-solid fa-download"></i> 下载《${escapeHtml(msg.file.fileName)}》</a>`;
                    }

                    return `
                        <tr>
                            <td>${msg.createdAt || '未知时间'}</td>
                            <td><strong>${escapeHtml(msg.name)}</strong></td>
                            <td style="color: #fc8181;">${escapeHtml(msg.phone)}</td>
                            <td>${escapeHtml(msg.demand || '无特定描述')}</td>
                            <td>${fileHtml}</td>
                            <td>
                                <button class="btn btn-delete" onclick="deleteMessage('${msg.id}')"><i class="fa-solid fa-trash"></i> 删除</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('获取列表异常:', err);
            }
        }

        // 删除记录
        async function deleteMessage(id) {
            if (!confirm('警告：确定要彻底删除这条记录及对应的云端附件吗？')) return;
            const token = getToken();
            if (!token) {
                showLoginOverlay('登录超时，请重新登录');
                return;
            }

            try {
                const res = await fetch(`/api/messages/${id}?token=${encodeURIComponent(token)}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': token }
                });
                const result = await res.json();
                if (result.success) {
                    fetchMessages();
                } else {
                    alert('删除失败：' + (result.error || '权限不足'));
                }
            } catch (err) {
                alert('网络请求失败');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
